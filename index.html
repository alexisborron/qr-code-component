<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Scan the QR code to visit Frontend Mentor and build projects to improve your front-end skills.">
  <title>QR code component | Frontend Mentor</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <article class="card">
      <img class="card__qr" src="./images/image-qr-code.png" alt="QR code linking to the Frontend Mentor website"
        width="288" height="288">

      <div class="card__body">
        <h1 class="card__title">Improve your front-end skills by building projects</h1>
        <p class="card__text">
          Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
        </p>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
      rel="noopener noreferrer">Frontend Mentor</a>.
    Coded by <a href="https://github.com/alexisborron">Alexis</a>.
  </footer>
</body>

</html>
